---
layout: default
---

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    {
      "@type": "ListItem",
      "position": 1,
      "name": "Home",
      "item": "{{ site.url }}/"
    },
    {
      "@type": "ListItem",
      "position": 2,
      "name": "{{ category_name }}",
      "item": "{{ site.url }}/categories/{{ category }}/"
    },
    {
      "@type": "ListItem",
      "position": 3,
      "name": "#{{ build_number }} {{ title }}"
    }
  ]
}
</script>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "HowTo",
  "name": "{{ title }}",
  "description": {{ description | jsonify }},
  "image": "{{ site.url }}{{ image }}"{% if junk.size > 0 %},
  "supply": [{% for item in junk %}
    { "@type": "HowToSupply", "name": "{{ item }}" }{% unless forloop.last %},{% endunless %}{% endfor %}
  ]{% endif %},
  "totalTime": "{% case ratings.time %}{% when 1 %}PT2H{% when 2 %}PT8H{% when 3 %}PT16H{% when 4 %}PT40H{% when 5 %}PT80H{% endcase %}"
}
</script>

<nav class="breadcrumb" aria-label="Breadcrumb">
  <a href="/">Home</a> &rsaquo;
  <a href="/categories/{{ category }}/">{{ category_name }}</a> &rsaquo;
  <span aria-current="page">#{{ build_number }} {{ title }}</span>
</nav>

{{ content }}

<div class="build-tracker" id="buildTracker">
  <button class="tracker-btn" id="completedBtn">&#9744; Mark as Completed</button>
  <button class="tracker-btn tracker-btn-want" id="wantBtn">&#128204; Want to Build</button>
</div>

<div class="share-buttons" id="shareButtons">
  <span class="share-label">Share this build:</span>
  <button class="share-btn" id="copyLinkBtn" aria-label="Copy link">&#128279; Copy Link</button>
  <a class="share-btn" id="shareTwitter" href="#" target="_blank" rel="noopener" aria-label="Share on X">&#120143; Post</a>
  <a class="share-btn" id="shareReddit" href="#" target="_blank" rel="noopener" aria-label="Share on Reddit">&#128172; Reddit</a>
</div>

<script>
(function(){
  var buildNum = {{ build_number }};

  // Tracker
  function getList(key) {
    try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e) { return []; }
  }
  function setList(key, arr) { localStorage.setItem(key, JSON.stringify(arr)); }
  function toggle(key, num) {
    var list = getList(key);
    var idx = list.indexOf(num);
    if (idx === -1) list.push(num); else list.splice(idx, 1);
    setList(key, list);
    return idx === -1;
  }
  function updateUI() {
    var c = getList("jg-completed"), w = getList("jg-wantToBuild");
    var cBtn = document.getElementById("completedBtn"), wBtn = document.getElementById("wantBtn");
    if (c.indexOf(buildNum) !== -1) {
      cBtn.innerHTML = "&#9745; Completed!"; cBtn.classList.add("active");
    } else {
      cBtn.innerHTML = "&#9744; Mark as Completed"; cBtn.classList.remove("active");
    }
    if (w.indexOf(buildNum) !== -1) {
      wBtn.innerHTML = "&#128204; On My List!"; wBtn.classList.add("active");
    } else {
      wBtn.innerHTML = "&#128204; Want to Build"; wBtn.classList.remove("active");
    }
  }
  document.getElementById("completedBtn").addEventListener("click", function(){ var added = toggle("jg-completed", buildNum); updateUI(); if(typeof gtag==='function') gtag('event', added ? 'build_completed' : 'build_uncompleted', {build_number: buildNum}); });
  document.getElementById("wantBtn").addEventListener("click", function(){ var added = toggle("jg-wantToBuild", buildNum); updateUI(); if(typeof gtag==='function') gtag('event', added ? 'build_wanted' : 'build_unwanted', {build_number: buildNum}); });
  updateUI();

  // Share buttons
  var url = window.location.href;
  var text = "#{{ build_number }} {{ title }} — Junkyard Genius";
  document.getElementById("shareTwitter").href = "https://x.com/intent/tweet?text=" + encodeURIComponent(text) + "&url=" + encodeURIComponent(url);
  document.getElementById("shareTwitter").addEventListener("click", function(){ if(typeof gtag==='function') gtag('event', 'share', {method: 'twitter', build_number: buildNum}); });
  document.getElementById("shareReddit").href = "https://reddit.com/submit?url=" + encodeURIComponent(url) + "&title=" + encodeURIComponent(text);
  document.getElementById("shareReddit").addEventListener("click", function(){ if(typeof gtag==='function') gtag('event', 'share', {method: 'reddit', build_number: buildNum}); });
  document.getElementById("copyLinkBtn").addEventListener("click", function(){
    var btn = this;
    if(typeof gtag==='function') gtag('event', 'share', {method: 'copy_link', build_number: buildNum});
    navigator.clipboard.writeText(url).then(function(){
      btn.textContent = "\u2713 Copied!";
      setTimeout(function(){ btn.innerHTML = "&#128279; Copy Link"; }, 2000);
    });
  });
})();
</script>
