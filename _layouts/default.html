<!doctype html>
<html class="dark" lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{{ title | default: site.title }}</title>
    <meta name="description" content="{{ description | default: site.description }}">
    <meta property="og:title" content="{{ title | default: site.title }}">
    <meta property="og:description" content="{{ description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}{{ image | default: '/images/og-social.jpg' }}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    {% include "head-custom.html" %}
  </head>
  <body class="bg-background text-on-surface font-body selection:bg-primary-container selection:text-on-primary-container">
    <!--
      ██  ██  ██  ██  ██  ██  ██  ██  ██  ██  ██  ██
      ░░                                           ░░
      ░░   You're reading the source code.         ░░
      ░░   That means you're our kind of person.   ░░
      ░░   Build something insane.                 ░░
      ░░                                           ░░
      ░░   rbrents3000@gmail.com                   ░░
      ░░                                           ░░
      ██  ██  ██  ██  ██  ██  ██  ██  ██  ██  ██  ██
    -->
    <a class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-4 focus:z-[999] focus:px-4 focus:py-2 focus:bg-primary-container focus:text-on-primary-container focus:font-bold focus:rounded-sm" href="#main">Skip to main content</a>

    {% include "nav.html" %}

    <div class="flex min-h-screen">
      {% include "sidebar.html" %}

      <main id="main" class="flex-1 lg:ml-64 bg-background">
        {% if raw_layout %}
          {{ content }}
        {% else %}
          <div class="max-w-4xl mx-auto px-6 lg:px-12 py-8">
            <article class="prose prose-invert prose-headings:font-headline prose-headings:uppercase prose-headings:tracking-tight prose-a:text-primary-container prose-a:no-underline hover:prose-a:text-primary prose-img:rounded-lg prose-img:shadow-lg max-w-none">
              {{ content }}
            </article>
          </div>
        {% endif %}

        {% include "footer.html" %}
      </main>
    </div>

    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(){});
    }
    document.querySelectorAll('nav a').forEach(function(link){
      link.addEventListener('click', function(){
        if(typeof gtag==='function') gtag('event','nav_click',{destination:this.textContent.trim().toLowerCase()});
      });
    });

    // ⚡ Console welcome
    console.log('%c⚡ JUNKYARD GENIUS ⚡', 'color:#ff6b35;font-size:24px;font-weight:900;text-shadow:0 0 10px rgba(255,107,53,0.5)');
    console.log('%cYou found the console. You\'re already one of us.', 'color:#eaedf3;font-size:13px');
    console.log('%c338 builds · 33 categories · 0 safety guarantees', 'color:#7a7f93;font-size:11px');
    console.log('%cGot ideas? Found a bug? rbrents3000@gmail.com', 'color:#5b9cf6;font-size:11px');

    // ⚡ Konami Code: ↑↑↓↓←→←→BA
    (function(){
      var seq = [38,38,40,40,37,39,37,39,66,65], pos = 0;
      document.addEventListener('keydown', function(e){
        if(e.keyCode === seq[pos]) { pos++; } else { pos = 0; }
        if(pos === seq.length){
          pos = 0;
          if(typeof gtag==='function') gtag('event','easter_egg',{type:'konami_code'});
          var d = document.createElement('div');
          d.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:rgba(10,10,15,0.95);color:#ff6b35;font-size:2.5rem;font-weight:900;font-family:Inter,sans-serif;letter-spacing:-0.02em;animation:konamiFade 2s ease forwards';
          d.textContent = '⚡ JUNKYARD MODE ACTIVATED ⚡';
          var s = document.createElement('style');
          s.textContent = '@keyframes konamiFade{0%{opacity:0;transform:scale(0.8)}15%{opacity:1;transform:scale(1.05)}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0}}';
          document.head.appendChild(s);
          document.body.appendChild(d);
          setTimeout(function(){ d.remove(); s.remove(); }, 2100);
          document.querySelectorAll('img').forEach(function(img){
            img.style.transition = 'filter 0.5s ease';
            img.style.filter = 'hue-rotate(180deg) saturate(2)';
          });
          setTimeout(function(){
            document.querySelectorAll('img').forEach(function(img){
              img.style.filter = '';
              setTimeout(function(){ img.style.transition = ''; }, 500);
            });
          }, 5000);
        }
      });
    })();

    // ⚡ ?debug=true — show builder profile
    if(new URLSearchParams(window.location.search).get('debug') === 'true'){
      try {
        var completed = JSON.parse(localStorage.getItem('jg-completed')) || [];
        var wanted = JSON.parse(localStorage.getItem('jg-wantToBuild')) || [];
        console.log('%cBuilder profile loaded. You\'ve got taste.', 'color:#3dd68c;font-size:13px;font-weight:700');
        console.log('%cCompleted: ' + (completed.length || 'none yet'), 'color:#ff6b35');
        if(completed.length) console.table(completed.map(function(n){ return {build: '#' + n}; }));
        console.log('%cWant to build: ' + (wanted.length || 'none yet'), 'color:#9466ff');
        if(wanted.length) console.table(wanted.map(function(n){ return {build: '#' + n}; }));
      } catch(e){}
    }

    // ⚡ 50-click title
    (function(){
      var h = document.querySelector('h1');
      if(!h) return;
      var c = 0;
      h.addEventListener('click', function(){
        c++;
        if(c === 50){
          if(typeof gtag==='function') gtag('event','easter_egg',{type:'50_clicks'});
          var m = document.createElement('div');
          m.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:99999;background:#13141c;border:1px solid #ff6b35;color:#eaedf3;padding:16px 24px;border-radius:10px;font-family:Inter,sans-serif;font-size:14px;max-width:400px;text-align:center;box-shadow:0 8px 32px rgba(255,107,53,0.2)';
          m.innerHTML = 'Ok you clearly have too much time.<br><span style="color:#ff6b35;font-weight:700">Email rbrents3000@gmail.com</span> and tell me you clicked 50 times. I\'ll be impressed.';
          document.body.appendChild(m);
          setTimeout(function(){ m.style.transition='opacity 1s';m.style.opacity='0';setTimeout(function(){m.remove()},1000); }, 6000);
        }
      });
    })();
    </script>
  </body>
</html>
