<!doctype html>
<html lang="{{ site.lang }}">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>{{ title | default: site.title }}</title>
    <meta name="description" content="{{ description | default: site.description }}">
    <meta property="og:title" content="{{ title | default: site.title }}">
    <meta property="og:description" content="{{ description | default: site.description }}">
    <meta property="og:url" content="{{ site.url }}{{ page.url }}">
    <meta property="og:image" content="{{ site.url }}{{ image | default: '/images/og-social.jpg' }}">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/assets/css/style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    {% include "head-custom.html" %}
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>

      <div id="header">
        <nav>
          <ul>
            <li class="fork"><a href="/app/browse/">Browse</a></li>
            <li class="fork"><a href="/app/quiz/">Quiz</a></li>
            <li class="fork"><a href="/app/toolbox/">Toolbox</a></li>
            <li class="fork"><a href="{{ site.repo }}">GitHub</a></li>
          </ul>
        </nav>
      </div><!-- end header -->

    <div class="wrapper">

      <section>
        <header id="title">
          <h1>{{ site.title }}</h1>
          <p>{{ site.description }}</p>
          <hr>
          <span class="credits left">Project maintained by <a href="{{ site.owner_url }}">{{ site.owner }}</a></span>
          <span class="credits right">Theme by <a href="https://twitter.com/mattgraham">mattgraham</a></span>
        </header>

        <main id="main">
        {{ content }}
        </main>

      </section>

    </div>
    <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
    document.querySelectorAll('#header nav a').forEach(function(link){
      link.addEventListener('click', function(){
        if(typeof gtag==='function') gtag('event','nav_click',{destination:this.textContent.trim().toLowerCase()});
      });
    });
    </script>
  </body>
</html>
