<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Junkyard Genius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Space+Grotesk:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#131318;color:#e4e1e9;font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:420px}
h1{font-size:3rem;margin-bottom:16px}
h2{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;font-weight:900;text-transform:uppercase;letter-spacing:-0.02em;margin-bottom:12px}
p{color:#c6c4ce;font-size:1rem;line-height:1.6;margin-bottom:24px}
button{background:linear-gradient(135deg,#ff6b35,#ab3500);color:#fff;border:none;border-radius:0.125rem;padding:14px 28px;font-family:'Space Grotesk',sans-serif;font-size:1rem;font-weight:700;text-transform:uppercase;letter-spacing:-0.02em;cursor:pointer;transition:all 0.2s}
button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,107,53,0.3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>&#128268;</h1>
  <h2>You're offline</h2>
  <p>Looks like your connection dropped. Reconnect and try again to get back to building.</p>
  <button onclick="location.reload()">Try Again</button>
</div>
</body>
</html>
