<!DOCTYPE html>
<html lang="en-US">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Offline — Junkyard Genius</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#131318;color:#e4e1e9;font-family:'Inter',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.wrap{max-width:420px}
h1{font-size:3rem;margin-bottom:16px}
h2{font-size:1.4rem;font-weight:700;margin-bottom:12px}
p{color:#7a7f93;font-size:1rem;line-height:1.6;margin-bottom:24px}
button{background:linear-gradient(135deg,#ff6b35,#e04d18);color:#fff;border:none;border-radius:10px;padding:14px 28px;font-family:inherit;font-size:1rem;font-weight:700;cursor:pointer}
button:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(255,107,53,0.3)}
</style>
</head>
<body>
<div class="wrap">
  <h1>&#128268;</h1>
  <h2>You're offline</h2>
  <p>Looks like your connection dropped. Reconnect and try again to get back to building.</p>
  <button onclick="location.reload()">Try Again</button>
</div>
</body>
</html>
