<style>
/* ── Design System Variables (shared with quiz/browse) ── */
:root {
  --bg: #0a0a0f;
  --bg-subtle: #0f1016;
  --card: #13141c;
  --card-hover: #191a24;
  --border: #1e2030;
  --border-hover: #2a2d42;
  --text: #eaedf3;
  --text-dim: #7a7f93;
  --text-muted: #44475a;
  --orange: #ff6b35;
  --orange-glow: rgba(255,107,53,0.12);
  --blue: #5b9cf6;
  --red: #f06060;
  --purple: #9466ff;
  --green: #3dd68c;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-xs: 6px;
}

/* ── Global Overrides ── */
body {
  background: var(--bg) !important;
  color: var(--text) !important;
  font-family: 'Inter', system-ui, -apple-system, sans-serif !important;
  font-size: 15px !important;
  line-height: 1.7 !important;
}

/* Ambient background gradient */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,107,53,0.06), transparent),
    radial-gradient(ellipse 60% 40% at 80% 90%, rgba(148,102,255,0.04), transparent);
}

/* ── Header ── */
#header {
  background: rgba(10,10,15,0.92) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border) !important;
  height: auto !important;
  padding: 12px 0 !important;
}
#header nav {
  max-width: 900px;
  margin: 0 auto;
}
#header nav li.title {
  padding-top: 0;
}
#header nav li.title a {
  font-family: 'Inter', sans-serif !important;
  font-weight: 800 !important;
  font-size: 1.1rem !important;
  letter-spacing: -0.02em;
}
#header nav ul li a {
  background: none !important;
  border: 1px solid var(--border) !important;
  color: var(--text-dim) !important;
  font-family: 'Inter', sans-serif !important;
  font-size: 0.8rem !important;
  font-weight: 600 !important;
  padding: 8px 16px !important;
  border-radius: var(--radius-xs) !important;
  transition: all 0.2s ease !important;
}
#header nav ul li a:hover {
  background: var(--card) !important;
  border-color: var(--border-hover) !important;
  color: var(--orange) !important;
}
#header nav ul li.fork a {
  border-color: var(--orange) !important;
  color: var(--orange) !important;
}
#header nav ul li.fork a:hover {
  background: var(--orange-glow) !important;
}

/* ── Layout Width ── */
.wrapper {
  max-width: 900px !important;
  position: relative;
  z-index: 1;
}
section {
  max-width: 900px !important;
}

/* ── Title Area ── */
#title {
  border-bottom: 1px solid var(--border) !important;
  padding-bottom: 16px !important;
  margin-bottom: 24px !important;
}
#title h1 {
  font-family: 'Inter', sans-serif !important;
  font-weight: 900 !important;
  font-size: 2rem !important;
  letter-spacing: -0.03em !important;
  color: var(--text) !important;
}
#title p {
  color: var(--text-dim) !important;
  font-size: 0.95rem !important;
}
#title hr {
  border-color: var(--border) !important;
}
#title .credits {
  color: var(--text-muted) !important;
  font-size: 0.75rem !important;
}
#title .credits a {
  color: var(--text-muted) !important;
}

/* ── Typography ── */
h1, h2, h3, h4, h5, h6 {
  font-family: 'Inter', sans-serif !important;
  color: var(--text) !important;
}
h1 {
  font-size: 1.8rem !important;
  font-weight: 800 !important;
  letter-spacing: -0.02em !important;
  line-height: 1.2 !important;
}
h2 {
  font-size: 1.4rem !important;
  font-weight: 700 !important;
  letter-spacing: -0.01em !important;
  margin-top: 2em !important;
  padding-bottom: 8px !important;
  border-bottom: 1px solid var(--border) !important;
}
h3 {
  font-size: 1.15rem !important;
  font-weight: 600 !important;
  color: var(--text) !important;
}

/* ── Links ── */
a {
  color: var(--orange) !important;
  text-decoration: none !important;
  transition: color 0.2s ease !important;
}
a:hover {
  color: #ff8c5a !important;
  text-decoration: none !important;
}

/* ── Tables ── */
table {
  width: 100% !important;
  border-collapse: separate !important;
  border-spacing: 0 !important;
  background: var(--card) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius-sm) !important;
  overflow: hidden !important;
  margin: 1.5em 0 !important;
}
th {
  background: var(--bg-subtle) !important;
  color: var(--text-dim) !important;
  font-size: 0.72rem !important;
  font-weight: 700 !important;
  text-transform: uppercase !important;
  letter-spacing: 0.06em !important;
  padding: 10px 14px !important;
  border-bottom: 1px solid var(--border) !important;
  font-family: 'Inter', sans-serif !important;
}
td {
  padding: 10px 14px !important;
  border-bottom: 1px solid var(--border) !important;
  font-size: 0.88rem !important;
  color: var(--text) !important;
}
tr:last-child td {
  border-bottom: none !important;
}
tr:nth-child(even) td {
  background: rgba(15,16,22,0.5) !important;
}
tr:hover td {
  background: var(--card-hover) !important;
}

/* ── Blockquotes ── */
blockquote {
  border-left: 3px solid var(--orange) !important;
  background: rgba(255,107,53,0.04) !important;
  padding: 12px 20px !important;
  margin: 1em 0 !important;
  border-radius: 0 var(--radius-xs) var(--radius-xs) 0 !important;
  font-style: normal !important;
  color: var(--text-dim) !important;
}
blockquote strong {
  color: var(--text) !important;
}

/* CAUTION callouts */
blockquote:has(strong:first-child) {
  border-left-color: var(--red) !important;
  background: rgba(240,96,96,0.04) !important;
}

/* ── Images ── */
img {
  max-width: 100%;
  height: auto;
  border-radius: var(--radius-sm);
}
section img {
  box-shadow: 0 4px 24px rgba(0,0,0,0.3);
  margin: 1em 0;
}
/* Don't style badges/shields */
img[src*="shields.io"],
img[src*="badge"] {
  border-radius: 4px !important;
  box-shadow: none !important;
  margin: 0 2px !important;
}

/* ── Code Blocks ── */
code {
  background: var(--bg-subtle) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius-xs) !important;
  color: var(--text) !important;
  font-size: 0.85em !important;
  padding: 3px 6px !important;
}
pre {
  background: var(--bg-subtle) !important;
  border: 1px solid var(--border) !important;
  border-radius: var(--radius-sm) !important;
  padding: 16px 20px !important;
  box-shadow: none !important;
}
pre code {
  border: none !important;
  padding: 0 !important;
}

/* ── Details/Summary (collapsible sections) ── */
details {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 0;
  margin: 1em 0;
  overflow: hidden;
}
details summary {
  padding: 14px 20px;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95rem;
  color: var(--text);
  transition: background 0.2s ease;
  list-style: none;
}
details summary::-webkit-details-marker { display: none; }
details summary::before {
  content: '▸ ';
  color: var(--orange);
  font-weight: 800;
}
details[open] summary::before { content: '▾ '; }
details summary:hover {
  background: var(--card-hover);
}
details > *:not(summary) {
  padding: 0 20px;
}

/* ── Horizontal Rules ── */
hr {
  border: none !important;
  border-top: 1px solid var(--border) !important;
  margin: 2em 0 !important;
}

/* ── Lists ── */
ul, ol {
  color: var(--text);
}
li {
  margin-bottom: 4px;
}

/* ── Breadcrumbs (build pages) ── */
.breadcrumb {
  font-size: 0.82em;
  margin-bottom: 1.5em;
  color: var(--text-muted);
  padding: 10px 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-xs);
}
.breadcrumb a {
  color: var(--orange) !important;
}

/* ── Build Navigation (prev/next) ── */
.build-nav {
  display: flex;
  justify-content: space-between;
  margin-top: 2em;
  padding-top: 0;
  border-top: none;
  gap: 12px;
}
.build-nav a {
  color: var(--text-dim) !important;
  font-size: 0.85em;
  max-width: 45%;
  padding: 12px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  transition: all 0.2s ease;
}
.build-nav a:hover {
  border-color: var(--border-hover) !important;
  color: var(--orange) !important;
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  text-decoration: none !important;
}
.nav-next { text-align: right; margin-left: auto; }

/* ── Strong text ── */
strong {
  font-family: 'Inter', sans-serif !important;
  color: var(--text) !important;
}

/* ── Checkbox lists (ingredients) ── */
input[type="checkbox"] {
  accent-color: var(--orange);
}

/* ── Build Tracker ── */
.build-tracker {
  display: flex;
  gap: 8px;
  margin: 1.5em 0;
  flex-wrap: wrap;
}
.tracker-btn {
  padding: 10px 18px;
  border-radius: var(--radius-xs);
  border: 1.5px solid var(--border);
  background: var(--card);
  color: var(--text-dim) !important;
  font-family: 'Inter', sans-serif !important;
  font-size: 0.85rem !important;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
}
.tracker-btn:hover {
  border-color: var(--border-hover);
  background: var(--card-hover);
}
.tracker-btn.active {
  border-color: var(--green);
  color: var(--green) !important;
  background: rgba(61,214,140,0.08);
}
.tracker-btn-want.active {
  border-color: var(--orange);
  color: var(--orange) !important;
  background: var(--orange-glow);
}

/* ── Share Buttons ── */
.share-buttons {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 1em 0 2em;
  padding: 14px 18px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.share-label {
  font-size: 0.78rem;
  font-weight: 600;
  color: var(--text-muted) !important;
  margin-right: 4px;
}
.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 6px 14px;
  border-radius: var(--radius-xs);
  border: 1px solid var(--border);
  background: var(--bg) !important;
  color: var(--text-dim) !important;
  font-family: 'Inter', sans-serif !important;
  font-size: 0.78rem !important;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none !important;
}
.share-btn:hover {
  border-color: var(--orange) !important;
  color: var(--orange) !important;
  background: var(--orange-glow) !important;
}

/* ── Category Card Grid ── */
.cat-card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  margin: 1.5em 0;
}
.cat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 16px 20px;
  transition: all 0.2s;
  text-decoration: none !important;
  display: block;
  color: inherit !important;
}
.cat-card:hover {
  border-color: var(--border-hover);
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
  text-decoration: none !important;
}
.cat-card .cc-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}
.cat-card .cc-num {
  font-size: 0.72rem;
  font-weight: 800;
  color: var(--orange);
  background: var(--orange-glow);
  padding: 3px 8px;
  border-radius: var(--radius-xs);
}
.cat-card .cc-name {
  font-size: 0.92rem;
  font-weight: 700;
  flex: 1;
  line-height: 1.3;
}
.cat-card .cc-ratings {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px 12px;
}
.cat-card .cc-r {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  overflow: hidden;
}
.cat-card .cc-l {
  font-size: 0.6rem;
  font-weight: 600;
  color: var(--text-muted);
  width: 32px;
  flex-shrink: 0;
  text-transform: uppercase;
}
.cat-card .cc-bar {
  flex: 1;
  height: 4px;
  border-radius: 2px;
  background: var(--border);
  overflow: hidden;
  min-width: 0;
}
.cat-card .cc-fill {
  height: 100%;
  border-radius: 2px;
}
.cc-fill.jaw{background:var(--orange)}.cc-fill.brain{background:var(--blue)}
.cc-fill.wallet{background:var(--green)}.cc-fill.spicy{background:var(--red)}
.cc-fill.clout{background:var(--purple)}.cc-fill.time{background:var(--text-muted)}

/* ── Mobile Responsive ── */
@media (max-width: 768px) {
  .wrapper { padding: 0 16px !important; }
  h1 { font-size: 1.4rem !important; }
  h2 { font-size: 1.2rem !important; }
  table { font-size: 0.8rem !important; }
  td, th { padding: 8px 10px !important; }
  .breadcrumb { font-size: 0.75em; }
  .build-nav { flex-direction: column; }
  .build-nav a { max-width: 100%; }
  #header nav ul li a { font-size: 0.7rem !important; padding: 6px 10px !important; }
}

/* ── Reduced Motion ── */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    transition-duration: 0.01ms !important;
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}

/* ── Skip Link ── */
.skip-link {
  position: absolute;
  top: -100%;
  left: 16px;
  z-index: 999;
  padding: 8px 16px;
  background: var(--orange);
  color: #fff !important;
  font-weight: 700;
  font-size: 0.85rem;
  border-radius: var(--radius-xs);
  text-decoration: none !important;
}
.skip-link:focus {
  top: 8px;
}

/* ── Print Stylesheet ── */
@media print {
  #header,
  .breadcrumb,
  .build-nav,
  .share-buttons,
  .build-tracker,
  body::before {
    display: none !important;
  }
  body {
    background: #fff !important;
    color: #111 !important;
    font-size: 12pt !important;
    line-height: 1.5 !important;
  }
  .wrapper, section {
    max-width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  h1, h2, h3, h4, h5, h6 {
    color: #111 !important;
    page-break-after: avoid;
  }
  h1 { font-size: 18pt !important; }
  h2 { font-size: 14pt !important; border-bottom: 1px solid #ccc !important; }
  h3 { font-size: 12pt !important; }
  a { color: #111 !important; text-decoration: underline !important; }
  a[href^="http"]::after {
    content: " (" attr(href) ")";
    font-size: 0.8em;
    color: #666;
  }
  a[href^="#"]::after,
  a[href^="/"]::after { content: none; }
  table { background: #fff !important; border: 1px solid #ccc !important; }
  th { background: #f5f5f5 !important; color: #333 !important; }
  td { color: #333 !important; border-bottom: 1px solid #ddd !important; }
  tr:nth-child(even) td { background: #fafafa !important; }
  tr:hover td { background: transparent !important; }
  blockquote {
    border-left: 3px solid #999 !important;
    background: #f9f9f9 !important;
    color: #333 !important;
  }
  img { max-width: 100% !important; box-shadow: none !important; page-break-inside: avoid; }
  code, pre { background: #f5f5f5 !important; border-color: #ddd !important; color: #111 !important; }
  details { border: 1px solid #ccc !important; background: #fff !important; }
}
</style>
