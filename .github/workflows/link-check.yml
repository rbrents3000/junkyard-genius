name: Check Internal Links

on:
  push:
    branches: [master]
    paths: ['**/*.md']
  pull_request:
    branches: [master]
    paths: ['**/*.md']

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal markdown links
        run: |
          echo "Checking internal markdown links..."
          ERRORS=0
          TMPFILE=$(mktemp)

          # Find all markdown links to .md files
          while IFS= read -r file; do
            dir=$(dirname "$file")

            # Strip code blocks before searching for links
            CLEANED=$(sed '/^```/,/^```/d' "$file")

            # Extract relative .md links from cleaned content
            while IFS= read -r link; do
              # Skip external URLs
              if [[ "$link" == http* ]]; then
                continue
              fi

              # Resolve the path relative to the file's directory
              target="$dir/$link"

              if [ ! -f "$target" ]; then
                echo "::error file=$file::Broken link: $link (resolved to $target)"
                echo "BROKEN" >> "$TMPFILE"
              fi
            done < <(echo "$CLEANED" | grep -oP '\[.*?\]\(\K[^)]+\.md(?=\))' 2>/dev/null)
          done < <(find . -name "*.md" -not -path "./.git/*")

          # Check image references
          while IFS= read -r file; do
            dir=$(dirname "$file")

            # Strip code blocks before searching for image refs
            CLEANED=$(sed '/^```/,/^```/d' "$file")

            while IFS= read -r img; do
              target="$dir/$img"
              if [ ! -f "$target" ]; then
                echo "::error file=$file::Missing image: $img (resolved to $target)"
                echo "BROKEN" >> "$TMPFILE"
              fi
            done < <(echo "$CLEANED" | grep -oP 'src="(?!http)\K[^"]+\.(jpg|png|gif|svg)' 2>/dev/null)
          done < <(find . -name "*.md" -not -path "./.git/*")

          ERRORS=$(wc -l < "$TMPFILE")
          rm -f "$TMPFILE"

          if [ "$ERRORS" -gt 0 ]; then
            echo ""
            echo "Found $ERRORS broken link(s). Fix them before merging."
            exit 1
          else
            echo "All internal links verified."
          fi
