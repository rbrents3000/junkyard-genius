name: Check Internal Links

on:
  push:
    branches: [master]
    paths: ['**/*.md']
  pull_request:
    branches: [master]
    paths: ['**/*.md']

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check internal markdown links
        run: |
          echo "Checking internal markdown links..."
          ERRORS=0

          # Find all markdown links to .md files
          while IFS= read -r file; do
            dir=$(dirname "$file")

            # Extract relative .md links from the file
            grep -oP '\[.*?\]\(\K[^)]+\.md(?=\))' "$file" 2>/dev/null | while read -r link; do
              # Skip external URLs
              if [[ "$link" == http* ]]; then
                continue
              fi

              # Resolve the path relative to the file's directory
              target="$dir/$link"

              if [ ! -f "$target" ]; then
                echo "::error file=$file::Broken link: $link (resolved to $target)"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done < <(find . -name "*.md" -not -path "./.git/*")

          # Also check image references
          while IFS= read -r file; do
            dir=$(dirname "$file")

            grep -oP 'src="(?!http)\K[^"]+\.(jpg|png|gif|svg)' "$file" 2>/dev/null | while read -r img; do
              target="$dir/$img"
              if [ ! -f "$target" ]; then
                echo "::error file=$file::Missing image: $img (resolved to $target)"
                ERRORS=$((ERRORS + 1))
              fi
            done
          done < <(find . -name "*.md" -not -path "./.git/*")

          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "Found $ERRORS broken link(s). Fix them before merging."
            exit 1
          else
            echo "All internal links verified."
          fi
